<!-- Satu peta untuk empat variabel: warna = suhu, ikon = awan + hujan, angka = kelembapan,
     partikel = angin. Diisi oleh app.py (penanda DATA di bawah). Responsif: digambar ulang saat
     ukuran layar berubah; tinggi mengikuti lebar (iframe Streamlit menyesuaikan tinggi isi). -->
<div id="stage">
  <div id="title"></div>
  <div id="mapbox"><svg id="map"></svg><canvas id="wind"></canvas></div>
  <div id="legend"></div>
  <div id="tip"></div>
</div>
<style>
  html, body { margin: 0; font-family: "Source Sans Pro", sans-serif; }
  /* Semua teks di dalam panel gelap: terbaca di tema terang maupun gelap. */
  #stage { position: relative; background: #1e293b; border-radius: 8px; overflow: hidden; color: #f1f5f9; }
  #title { padding: 8px 12px 0; font-weight: 600; font-size: 15px; }
  #mapbox { position: relative; }
  #map, #wind { position: absolute; left: 0; top: 0; }
  #wind { pointer-events: none; }
  #map path { stroke: rgba(255,255,255,.55); stroke-width: .7; cursor: pointer; }
  #map path.active { stroke: #fff; stroke-width: 2; }
  #map text { pointer-events: none; text-anchor: middle; }
  #map .rh { font-weight: 600; fill: #fff; paint-order: stroke; stroke: rgba(15,23,42,.8); stroke-width: 2.5px; }
  #tip { position: absolute; display: none; pointer-events: none; background: rgba(15,23,42,.94); color: #fff;
         padding: 6px 9px; border-radius: 6px; font-size: 13px; line-height: 1.4; max-width: 240px; z-index: 2; }
  #legend { margin: 0 8px 8px; background: rgba(15,23,42,.82); padding: 6px 10px; border-radius: 6px;
            font-size: 12px; line-height: 1.6; }
  #legend .row { display: flex; gap: 4px 10px; align-items: center; flex-wrap: wrap; }
  #bar { width: min(180px, 40vw); height: 10px; border-radius: 3px; }
  @media (max-width: 480px) { #title { font-size: 13px; } #legend { font-size: 11px; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
const D = /*DATA*/null;
const ARAH = ["Utara", "Timur Laut", "Timur", "Tenggara", "Selatan", "Barat Daya", "Barat", "Barat Laut"];
const GEO = {type: "FeatureCollection", features: D.features};

// Warna isi = suhu; hanya 15–85% rentang skema agar tidak terlalu gelap dan partikel tetap terlihat.
const temps = Object.values(D.values).map(r => r.t);
const lo = d3.min(temps), hi = d3.max(temps) > lo ? d3.max(temps) : lo + 1;
const interp = t => d3.interpolateRdYlBu(0.15 + 0.7 * (1 - t));
const color = r => r ? interp((r.t - lo) / (hi - lo)) : "#64748b";

function windAt(lon, lat, clamp = false) {  // interpolasi bilinear; di luar grid null, atau titik tepi jika clamp
  if (!D.wind) return null;
  const {lats, lons, u, v} = D.wind;
  let fy = (lats[0] - lat) / (lats[0] - lats[1]), fx = (lon - lons[0]) / (lons[1] - lons[0]);
  const out = fx < 0 || fy < 0 || fx > lons.length - 1 || fy > lats.length - 1;
  if (out && !clamp) return null;
  // ponytail: di laut lepas di luar grid, partikel memakai angin titik grid terdekat (hanya visual).
  fx = Math.min(Math.max(fx, 0), lons.length - 1); fy = Math.min(Math.max(fy, 0), lats.length - 1);
  const x0 = Math.floor(fx), y0 = Math.floor(fy);
  const x1 = Math.min(x0 + 1, lons.length - 1), y1 = Math.min(y0 + 1, lats.length - 1);
  const dx = fx - x0, dy = fy - y0;
  const b = g => g[y0][x0] * (1 - dx) * (1 - dy) + g[y0][x1] * dx * (1 - dy) + g[y1][x0] * (1 - dx) * dy + g[y1][x1] * dx * dy;
  return [b(u), b(v)];
}
function windText(lon, lat) {
  const w = windAt(lon, lat);
  if (!w) return "";
  const from = (Math.atan2(-w[0], -w[1]) * 180 / Math.PI + 360) % 360;   // arah datang (konvensi meteorologi)
  return `<br>Angin: ${Math.hypot(w[0], w[1]).toFixed(0)} km/jam dari ${ARAH[Math.round(from / 45) % 8]}`;
}

// Legenda & judul tidak bergantung ukuran layar: cukup diisi sekali.
document.getElementById("title").textContent = D.title;
const stops = d3.range(0, 1.01, 0.1).map(t => interp(t)).join(",");
const maxW = D.wind ? d3.max(D.wind.u.flatMap((r, i) => r.map((u, j) => Math.hypot(u, D.wind.v[i][j])))) : null;
document.getElementById("legend").innerHTML =
  `<div class="row"><b>Suhu (°C)</b><span>${lo.toFixed(1)}</span>` +
  `<span id="bar" style="background:linear-gradient(90deg,${stops})"></span><span>${hi.toFixed(1)}</span></div>` +
  `<div class="row">${D.icons.map(([i, l]) => `<span>${i} ${l}</span>`).join("")}` +
  `<span>92% kelembapan</span>` + (D.wind ? `<span>〰 angin (maks ${maxW.toFixed(0)} km/jam)</span>` : "") + `</div>`;

let anim = null;
function render() {
  const W = document.getElementById("stage").clientWidth;
  const small = W < 520;
  // Tinggi peta mengikuti lebar dan bentuk wilayah (tidak ada ruang kosong di HP).
  const proj = d3.geoMercator().fitWidth(W - 16, GEO);
  const path = d3.geoPath(proj);
  const [[, y0], [, y1]] = path.bounds(GEO);
  const H = Math.ceil(y1 - y0) + 16;
  proj.translate([proj.translate()[0] + 8, proj.translate()[1] - y0 + 8]);
  d3.select("#mapbox").style("height", H + "px");

  const stage = document.getElementById("stage");
  const tip = d3.select("#tip");
  const svg = d3.select("#map").attr("width", W).attr("height", H);
  svg.selectAll("*").remove();
  const show = (ev, f) => {
    const [x, y] = d3.pointer(ev, stage);
    const r = D.values[f.properties.adm2];
    const [lon, lat] = proj.invert(d3.pointer(ev, svg.node()));
    svg.selectAll("path").classed("active", g => g === f);
    tip.style("display", "block").html(`<b>${f.properties.nama}</b>` + (r ? `<br>${r.icon} ${r.cuaca}` +
        `<br>Suhu: ${r.t.toFixed(1)} °C<br>Kelembapan: ${r.rh.toFixed(0)}%` +
        `<br>Tutupan awan: ${r.cc.toFixed(0)}%<br>Curah hujan: ${r.p.toFixed(1)} mm/jam` : "") + windText(lon, lat));
    const tw = tip.node().offsetWidth, th = tip.node().offsetHeight;   // tetap di dalam panel
    tip.style("left", Math.max(4, Math.min(x + 14, W - tw - 4)) + "px")
       .style("top", Math.max(4, Math.min(y + 14, stage.clientHeight - th - 4)) + "px");
  };
  const hide = () => { tip.style("display", "none"); svg.selectAll("path").classed("active", false); };
  // pointer* = mouse dan sentuhan; ketuk wilayah untuk tooltip, ketuk laut untuk menutup.
  svg.selectAll("path").data(D.features).join("path")
    .attr("d", path).attr("fill", f => color(D.values[f.properties.adm2]))
    .on("pointermove pointerdown", show).on("pointerleave", ev => ev.pointerType === "mouse" && hide());
  svg.on("pointerdown", ev => ev.target.tagName !== "path" && hide());

  // Ikon cuaca + kelembapan, wilayah besar dulu; yang bertabrakan dilewati. Ukuran mengikuti layar.
  const fs = small ? 13 : 18, bw = fs * 1.6, bh = fs * 1.9;
  const placed = [];
  const byArea = D.features.filter(f => D.values[f.properties.adm2]).sort((a, b) => path.area(b) - path.area(a));
  for (const f of byArea) {
    const [x, y] = path.centroid(f);
    if (placed.some(([px, py]) => Math.abs(px - x) < bw && Math.abs(py - y) < bh)) continue;
    placed.push([x, y]);
    const r = D.values[f.properties.adm2];
    svg.append("text").attr("x", x).attr("y", y).attr("font-size", fs).text(r.icon);
    svg.append("text").attr("class", "rh").attr("x", x).attr("y", y + fs * 0.72)
       .attr("font-size", small ? 9 : 10).text(`${r.rh.toFixed(0)}%`);
  }

  // Partikel angin.
  const canvas = document.getElementById("wind");
  const dpr = window.devicePixelRatio || 1;          // tajam di layar retina/HP
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (anim) cancelAnimationFrame(anim);
  if (!(D.wind && D.animate)) return;
  const [lon0, lat0] = proj.invert([0, 0]), [lon1, lat1] = proj.invert([W, H]);
  const N = Math.round(W * H / 260), MAXAGE = 90, K = 0.00022 * 800 / Math.max(W, 320);  // laju sama di semua lebar
  const spawn = p => { p.lon = lon0 + Math.random() * (lon1 - lon0);
                       p.lat = lat1 + Math.random() * (lat0 - lat1);
                       p.age = Math.floor(Math.random() * MAXAGE); return p; };
  const parts = Array.from({length: N}, () => spawn({}));
  (function frame() {
    ctx.globalCompositeOperation = "destination-in";      // jejak memudar
    ctx.fillStyle = "rgba(0,0,0,0.92)"; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
    const segs = [];
    for (const p of parts) {
      const w = windAt(p.lon, p.lat, true);
      if (++p.age > MAXAGE || p.lon < lon0 || p.lon > lon1 || p.lat < lat1 || p.lat > lat0) { spawn(p); p.age = 0; continue; }
      const a = proj([p.lon, p.lat]);
      p.lon += w[0] * K / Math.cos(p.lat * Math.PI / 180); p.lat += w[1] * K;
      segs.push(a, proj([p.lon, p.lat]));
    }
    // Garis gelap tipis di bawah garis putih: partikel terlihat di atas warna terang maupun laut gelap.
    for (const [style, width] of [["rgba(15,23,42,0.45)", 2.4], ["rgba(255,255,255,0.85)", 1.1]]) {
      ctx.strokeStyle = style; ctx.lineWidth = width; ctx.beginPath();
      for (let i = 0; i < segs.length; i += 2) { ctx.moveTo(...segs[i]); ctx.lineTo(...segs[i + 1]); }
      ctx.stroke();
    }
    anim = requestAnimationFrame(frame);
  })();
}

render();
let lastW = document.getElementById("stage").clientWidth, timer;
window.addEventListener("resize", () => {    // gambar ulang hanya jika lebar berubah (rotasi, ubah jendela)
  clearTimeout(timer);
  timer = setTimeout(() => {
    const w = document.getElementById("stage").clientWidth;
    if (w !== lastW) { lastW = w; render(); }
  }, 150);
});
</script>
