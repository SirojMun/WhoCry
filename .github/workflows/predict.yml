name: Prediksi per jam

on:
  schedule:
    - cron: "7,27,47 * * * *"   # 3× per jam: GitHub sering melewatkan jadwal; run ganda menimpa file jam yang sama
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-live
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data-live
          path: store

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Pasang dependensi
        run: pip install -r requirements-live.txt

      - name: Prediksi
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/predict_live.py --out store

      - name: Simpan ke branch data-live
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Prediksi $(date -u +'%Y-%m-%d %H:00') UTC" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
