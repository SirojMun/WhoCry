name: Pelatihan ulang mingguan

on:
  schedule:
    - cron: "41 19 * * *"   # tiap hari 02.41 WIB; skrip hanya melatih bila sudah >= 6 hari sejak yang terakhir
  workflow_dispatch:
    inputs:
      force:
        description: "Paksa pelatihan ulang sekarang"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-live          # sama dengan predict.yml agar tidak bentrok saat push
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: data-live
          path: store

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-live.txt

      - name: Pasang dependensi
        run: pip install -r requirements-live.txt

      - name: Champion vs challenger
        env:
          PYTHONPATH: src
        run: python scripts/retrain_live.py --live store ${{ inputs.force && '--force' || '' }}

      - name: Simpan ke branch data-live
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A models
          git commit -q -m "Pelatihan ulang $(date -u +'%Y-%m-%d')" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
